results_root: X:\Analysis\EyeHeadCoupling
results_with_data: false #true => save each session's results inside <data_folder>/results; false => save under results_root

saccade_config:
  saccade_threshold: 3.0
  saccade_threshold_torsion: 1.5
  blink_threshold: 10.0
  blink_detection: 1


#for prosaccade experiments
reward_contingency:
  reward_angle: 35 #half-width, in degrees, of the rewarded zone around the target direction
  congruency_window: [0.1, 0.4]  #fixed latency band (s, post target-onset) for the single-number "fraction toward target" congruency summary stat

#for fixation experiments
max_interval_fixations: 1.0 #this is how long we count a fixation of 0.7 sec valid after cue is presented.......


experiment_type: prosaccade #default session type when not overridden per-session below  
sessions:

